[project]
name = "verbum-pipeline"
version = "0.1.0"
description = "Offline, human-reviewed Verbum content publication"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "psycopg[binary]>=3.2,<4", "openai>=1.50,<2"]

[project.scripts]
verbum-pipeline = "verbum_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires VERBUM_TEST_DATABASE_URL and isolated PostgreSQL schemas"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
