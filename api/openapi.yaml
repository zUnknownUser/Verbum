openapi: 3.1.0
info:
  title: Verbum API
  version: 0.3.0
  description: |
    Scripture, editorial knowledge, grounded answers and chapter narration for Verbum on iOS and Android.

    **PT-BR:** use `lang=pt-BR` ou `Accept-Language: pt-BR`. Conteúdo editorial é público;
    IA, geração de áudio e uso da conta exigem um ID token do Firebase. O botão **Authorize**
    recebe esse token, nunca uma chave da OpenAI ou do Google. **Try it out** faz chamadas reais,
    sujeitas às mesmas cotas e ao mesmo orçamento dos apps.

    **English:** public editorial GETs are cacheable. Protected operations require a Firebase
    ID token, including tokens for anonymous Firebase users. App Check may also be required.
    Search works without authentication using lexical retrieval; verified users can use semantic retrieval.
    Narration already cached is shared globally. New generation remains subject to the global budget.

    References use canonical OSIS identifiers; apps display Scripture in the reader's chosen translation.
    Answers are grounded in the indexed WEB corpus and returned in the requested language.
    Errors use the `Problem` schema; use `code` for application behavior. IDs are opaque.
    The current server is selected below. Opening this documentation never calls a paid provider.
security: []   # editorial content stays public; paid operations override this below

servers:
  - url: /
    description: Current API host / Servidor atual

tags:
  - name: search
    description: Find passages, books and people / Busca bíblica
  - name: ask
    description: Answers grounded in Scripture / Perguntas com fontes
  - name: daily
    description: Daily reading / Leitura diária
  - name: entities
    description: People, places and concepts / Pessoas, lugares e conceitos
  - name: graph
    description: Connections between entities / Relações entre entidades
  - name: context
    description: Chapter context / Contexto de leitura
  - name: timeline
    description: Historical periods and events / Linha do tempo
  - name: tts
    description: Chapter narration and playback / Narração e reprodução
  - name: realtime
    description: Metered voice conversations / Conversas por voz
  - name: account
    description: Plan and remaining usage / Plano e uso disponível
  - name: health
    description: Service availability / Disponibilidade do serviço

paths:
  /v1/me/sync:
    post:
      tags: [account]
      operationId: syncPersonalData
      summary: Sync private reading data / Sincronizar dados pessoais
      description: |
        Registered Firebase accounts only (anonymous users receive 403). Changes are account-private,
        never included in AI prompts. Up to 100 changes per request and 200 downloaded records per page.
        Keep mutationId stable across retries. Cursor and baseRevision are server revisions.
        A null annotation value is a deletion tombstone; reading history cannot be deleted by sync.
        Independent annotation fields merge; simultaneous note
        edits preserve both texts separated by a divider. Concurrent deletion wins over an unseen edit.
        Visits and last position use event timestamps. Read offline from device storage; retry with backoff.
        Account storage is bounded to 50,000 records, 32 MiB and 100,000 mutation receipts; notes to 32 KiB.
      security:
        - FirebaseIDToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalSyncRequest'
      responses:
        '200':
          description: Accepted changes and a page of account changes. Persist cursor only after records reach durable device storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalSyncResponse'
        '400':
          description: Invalid payload, reference, timestamp or cursor
        '401':
          description: Firebase authentication required
        '403':
          description: Registered account required, App Check required, or account deletion pending
        '409':
          description: Storage limit reached; preserve the local outbox
        '429':
          description: Too many requests; respect Retry-After
        '503':
          description: Storage temporarily unavailable; keep local edits
  /v1/me/data:
    delete:
      tags: [account]
      operationId: deletePersonalData
      summary: Remove private account data / Excluir dados pessoais da conta
      description: |
        Account-deletion step. Removes synced notes, marks and reading history and permanently blocks
        new sync writes for this UID, including delayed requests from other devices. Idempotent.
        The server requires authentication within the last five minutes for registered users.
        Clients reauthenticate before calling and then delete the Firebase identity. Never call on sign-out.
      security:
        - FirebaseIDToken: []
      responses:
        '204':
          description: Data removed; account UID closed for synchronization
        '401':
          description: Authentication required
        '403':
          description: App Check required
        '429':
          description: Too many requests
        '503':
          description: Deletion not completed; retry before deleting the Firebase identity

  /healthz:
    get:
      tags: [health]
      operationId: liveness
      summary: Process liveness, independent of database availability.
      responses:
        '200':
          description: Process is running.
          content:
            text/plain:
              schema: { type: string }
  /readyz:
    get:
      tags: [health]
      operationId: readiness
      summary: Content store is reachable and the daily passage pool is populated.
      description: Bounded to two seconds, not cached, and does not call paid providers. Used by deployment health checks.
      responses:
        '200':
          description: Content is available.
          content:
            text/plain:
              schema: { type: string }
        '503':
          description: Store unavailable, timed out, or not seeded. No internal diagnostic is exposed.
          content:
            text/plain:
              schema: { type: string }
  /v1/tts/config:
    get:
      tags: [tts]
      operationId: speechConfiguration
      summary: Default speech version, without contacting the speech provider.
      description: Cached for 3600 seconds. Changes with default voice/settings or assembly revision.
      parameters:
        - name: language
          in: query
          required: true
          schema: { type: string, enum: [pt-BR, en-US] }
      responses:
        '200':
          description: Current audio version.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: string, pattern: '^[a-f0-9]{64}$' }
        '400':
          description: Unsupported or missing language.
  /v1/tts/playback:
    post:
      security:
        - FirebaseIDToken: []
      tags: [tts]
      operationId: startSpeechPlayback
      summary: Start or join progressive chapter narration.
      description: |
        Validates canonical chapter text and uses the same TTS admission limits, global
        reservation, idempotency and permanent audio cache as whole-file generation.
        Returns a short-lived same-origin status capability immediately. Poll that path
        without HTTP caching; quota/provider failures are returned by the status resource.
        Only this authenticated POST can initiate generation. GET media cannot generate audio.
        Active jobs are shared by canonical audio identity; 32 jobs per process, expiring after one hour.
      parameters:
        - $ref: '#/components/parameters/AppCheck'
        - $ref: '#/components/parameters/Installation'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpeechRequest' }
      responses:
        '200':
          description: Playback preparation accepted or already in progress.
          content:
            application/json:
              schema:
                type: object
                required: [statusPath]
                properties:
                  statusPath: { type: string }
        '400': { description: "Invalid canonical chapter request." }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: "App attestation required." }
        '409': { description: "Idempotency conflict." }
        '429': { description: "Request rate or playback capacity exceeded." }
        '503': { description: "Speech unavailable." }
  /v1/tts/playback/{token}/{asset}:
    get:
      security: []
      tags: [tts]
      operationId: speechPlaybackMedia
      summary: Read prepared HLS media or playback status using a one-hour capability.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
        - name: asset
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: |
            status returns ready, complete, playlistPath, snapshotPath, duration, audioPath and optional final MP3 cues.
            snapshot-NNNNNN.m3u8 is immutable finite VOD for the currently available excerpt, with ENDLIST.
            New clients play snapshots, then poll the same status capability for more audio and resume at
            the previous endpoint. They advance chapters only when complete=true. No new POST is needed.
            index.m3u8 is an append-only EVENT playlist with EXT-X-ENDLIST only on success.
            Listed TS segments contain AAC audio. chapter.mp3 is available only after completion.
            Poll status/playlist without caching; never interpret partial media as a complete chapter.
        '404': { description: "Unknown or expired capability or unpublished asset." }
        '429': { description: "Budget, pending generation or read rate limit." }
        '503': { description: "Generation failed; incomplete chapter must not be cached." }
  /v1/tts:
    post:
      security:
        - FirebaseIDToken: []
      tags: [tts]
      operationId: synthesizeSpeech
      summary: Generate MP3 reading audio with Google Cloud Text-to-Speech.
      description: |
        Verifies the supplied text against the canonical chapter identified by bookId, chapter and translation.
        Arbitrary text, unsupported voices, nonzero pitch and provider-side speed changes are rejected.
        Shared cached audio is replayed before checking generation quotas; only cache misses reserve global budget. Standard narration has no personal generation quota.
        Maximum 100000 UTF-8 bytes of text and 1 MiB request body. Plain text only.
        Automatically segments at 2200 bytes (below Google's 5000-byte limit) and returns one complete MP3,
        crossfading segment joins to avoid an audible seam, cached persistently by exact chapter text and
        normalized voice/audio settings.
        Defaults to Gemini 2.5 Pro TTS / Charon for Portuguese; optional chirp3 rollback uses pt-BR-Chirp3-HD-Aoede. English uses en-US-Standard-A.
        Speed defaults to 1.0; pitch must be omitted or zero for Chirp 3 HD.
        Generation can take up to 10 minutes; no response audio is sent until complete.
        Voice availability and support for speed/pitch depend on Google; invalid combinations
        return 400. Server-side Google credentials are never returned to clients.
        Responses use Cache-Control: no-store; the server keeps its own persistent chapter cache
        keyed by exact text and normalized settings, invisible to HTTP intermediaries.
      parameters:
        - $ref: '#/components/parameters/AppCheck'
        - $ref: '#/components/parameters/Installation'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechRequest'
            examples:
              portuguese:
                externalValue: examples/tts/request-pt-BR.json
              english:
                externalValue: examples/tts/request-en-US.json
      responses:
        '403':
          description: Plan does not allow the operation, or app attestation is required when App Check enforcement is enabled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Idempotency key was already bound to different content.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '200':
          description: MP3 bytes, ready to save or play (not JSON/base64).
          headers:
            X-Verbum-Audio-Cues:
              description: Optional JSON array of measured excerpts with verseStart, verseEnd, start and end (seconds), bound to these MP3 bytes. Present for requests with verses; absent means playback without synchronization.
              schema: { type: string }
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        '400':
          description: Invalid text, language, voice, speed, pitch, format or JSON.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '408':
          description: Request cancelled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Content-Type must be application/json.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Generation quota, pending duplicate, API rate limit or provider quota reached.
          headers:
            Retry-After:
              description: Seconds to wait; supplied for API limits.
              schema: { type: integer, example: 60 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: Invalid provider response; tts_failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: TTS or Firebase authentication unavailable; tts_unavailable or auth_unavailable.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '504':
          description: Provider timeout; tts_timeout.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/entities/{id}:
    get:
      tags: [entities]
      operationId: getEntityDetail
      summary: One entity's page (§9) — the facts, key passages, sources.
      description: Backs `GraphClient.detail(id)` and `GraphClient.entity(id)` (the apps read `.entity` from it).
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/EntityId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
              examples:
                david: { externalValue: examples/entities/david.json }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/entities:
    get:
      tags: [entities]
      operationId: listEntities
      summary: Every entity of one kind, for the Explore lists (§7). Passage nodes are never listed.
      description: Backs `GraphClient.entities(type)`. Sorted by name in the requested language.
      parameters:
        - name: type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/BibleEntityType' }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [entities]
                properties:
                  entities:
                    type: array
                    items: { $ref: '#/components/schemas/BibleEntity' }
              examples:
                people: { externalValue: examples/entities/people.json }

  /v1/entities/{id}/graph:
    get:
      tags: [graph]
      operationId: getEntityGraph
      summary: The one-hop neighbourhood (§8, §44). Never the whole graph.
      description: |
        Backs `GraphClient.neighbors(id, limit)`. Undirected: an edge stored as David → Goliath is
        returned for Goliath too. `nodes` are the neighbours (the root is not repeated in it);
        `edges` are every stored relationship among `root + nodes`. The apps ask `limit=24` and show
        a balanced dozen themselves (`GraphLayout.balanced`), so the server should return nodes in a
        stable, meaningful order (by edge confidence desc, then name) rather than by kind.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/EntityId'
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 1, default: 1 }
          description: Only 1 is served today; the parameter exists so the URL matches §44.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphSnapshot' }
              examples:
                david: { externalValue: examples/graph/david.json }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/passages/{reference}/context:
    get:
      tags: [context]
      operationId: getPassageContext
      summary: Chapter-level context (§10) — entities, related passages, sources.
      description: |
        Backs `ContextClient.chapter(reference)`. `reference` is `Book.Chapter` in OSIS ids
        (`1Sam.17`, `Ps.23`). Context is per chapter. Optional `verse` adds up to 24
        references to other occurrences of the same STEP entities attested in that verse.
        These are sourced entity associations, not asserted quotations or thematic parallels.
        **Missing coverage is 404 with code `content_unavailable`**, which the apps show as
        "no context yet" — never a generated explanation (§3.5).
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: reference
          in: path
          required: true
          schema: { type: string, pattern: '^[1-3]?[A-Za-z]+\.[0-9]+$' }
          example: 1Sam.17
        - name: verse
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 176 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PassageContext' }
              examples:
                sam17: { externalValue: examples/context/1Sam.17.json }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/timeline:
    get:
      tags: [timeline]
      operationId: getTimeline
      summary: Every period and event, chronological (§4.2), with dating precision.
      description: |
        Backs `TimelineClient.events()`; with `entity`, backs `TimelineClient.eventsFor(id)`.
        Order: by `startYear`, then longer spans first, unknown dates last. `entityNames` saves the
        apps one round-trip per chip (today they call /entities/{id} for each).
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: entity
          in: query
          required: false
          schema: { type: string }
          description: Only events whose `entityIds` contain this id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [events, entityNames]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/TimelineEvent' }
                  entityNames:
                    type: object
                    additionalProperties: { type: string }
                    description: Names for every id that appears in any `entityIds`.
              examples:
                all: { externalValue: examples/timeline/all.json }

  /v1/search:
    get:
      security:
        - {}
        - FirebaseIDToken: []
      tags: [search]
      operationId: search
      summary: References, books and entities for a query (§27–28).
      description: |
        Backs `SearchClient.search(query, language)`. The apps already parse references and match
        book names on device; the server may repeat that (cheap, and keeps one ranking) but MUST
        serve the entity groups. A direct reference match wins outright (§28): when `passages` is
        non-empty, `books` is empty.

        `passages`: hybrid full-text and pgvector retrieval over the complete indexed WEB corpus.
        Accent-insensitive PT-BR/English vocabulary expansion supports lexical fallback. Independent
        channels are fused by reciprocal rank, with bounded candidate pools. Direct Portuguese/English
        references bypass embeddings and are returned only if the verse exists in the corpus.
        A missing identity uses lexical/entity/reference search without a paid embedding call.
        A valid Firebase token (including anonymous users) enables semantic retrieval.
        Rate limits return 429 with Retry-After; invalid supplied tokens return 401.
        Missing Firebase configuration with a supplied token returns 503.
        Search results vary by Authorization. Embedding failures degrade to lexical retrieval.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/AppCheck'
        - $ref: '#/components/parameters/Installation'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/Lang'
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Firebase verification is not configured for a supplied identity.
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
              examples:
                david: { externalValue: examples/search/david.json }

  /v1/daily-verse:
    get:
      tags: [daily]
      operationId: getDailyVerse
      summary: The verse of the day — a reference only; the text comes from the reader's translation.
      description: |
        Not in §45; added for the Home card and the 7:00 notification. The apps compute this on
        device today (`DailyVerses`, deterministic per day) and will keep doing so as a fallback.
        The server answers for a date so the apps can plan 14 mornings ahead in one call.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
          description: First day, inclusive. Default today (server's UTC date).
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 31, default: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [verses]
                properties:
                  verses:
                    type: array
                    items:
                      type: object
                      required: [date, reference]
                      properties:
                        date: { type: string, format: date }
                        reference: { $ref: '#/components/schemas/PassageReference' }
              examples:
                week: { externalValue: examples/daily-verse/week.json }

  /v1/ask:
    post:
      security:
        - FirebaseIDToken: []
      tags: [ask]
      operationId: askScripture
      summary: Ask a question and receive an answer grounded in verified passages.
      description: |
        Accepts natural questions in Portuguese and English, including missing accents and short quotations.
        Retrieves verified Scripture using hybrid lexical/semantic ranking, diversifies passages and
        expands nearby verses to preserve the speaker and scene. Context is bounded to 48 verses and
        20000 UTF-8 bytes; it never loads the whole Bible into the model. Exact references bypass embeddings.
        Citations can only select real retrieved sources. An unsupported answer stays empty with low
        confidence; passageReferences may still offer nearby search results, not evidence for the claim.
        Answers follow lang or Accept-Language. Portuguese answers paraphrase WEB; they are not quotations
        from a licensed Portuguese translation. Expensive operations enforce server-owned plans, quotas,
        idempotency and budgets. A restricted operation can return indexed passages with a fallback code.
      parameters:
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/AppCheck'
        - $ref: '#/components/parameters/Installation'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              additionalProperties: false
              properties:
                question: { type: string, minLength: 1, maxLength: 500, example: "Onde Deus começa a falar com Jó?" }
                reference:
                  $ref: '#/components/schemas/PassageReference'
                  description: Optional reader anchor. Must select 1–6 verses; corpus text is verified before synthesis.
      responses:
        '403':
          description: Plan does not allow the operation, or app attestation is required when App Check enforcement is enabled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Idempotency key was already bound to different content.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Content-Type must be application/json.
        '429': { $ref: '#/components/responses/RateLimited' }
        '400':
          description: Invalid question or JSON body (one object, maximum 8 KiB).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: Upstream request failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AskResponse' }
        '503':
          description: Provider or Firebase authentication is not configured (ask_unavailable, realtime_unavailable or auth_unavailable, as applicable).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { code: ask_unavailable, message: "ask is not configured on this server" }

  /v1/realtime/session:
    post:
      security:
        - FirebaseIDToken: []
      tags: [realtime]
      operationId: createRealtimeSession
      summary: A one-use ticket for a metered voice connection through Verbum.
      description: |
        Returns a one-use Verbum ticket valid for 60 seconds. Connect to relayPath on the same
        API host using WebSocket and Authorization Bearer clientSecret. No provider credential
        is exposed. Audio passes through the backend without being persisted. Duration,
        output tokens, response count and spending are enforced there. Responses are no-store.
        Guest sessions cannot use voice. A verbum.limit event ends a restricted conversation.
      parameters:
        - $ref: '#/components/parameters/AppCheck'
        - $ref: '#/components/parameters/Installation'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: model
          in: query
          required: false
          schema: { type: string }
          description: Only omitted, empty, or gpt-realtime is accepted by the API access layer.
          # Clients cannot select an arbitrary paid model.
      responses:
        '403':
          description: Plan does not allow the operation, or app attestation is required when App Check enforcement is enabled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Idempotency key was already bound to different content.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '400':
          description: Invalid request or unsupported Realtime model.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: Upstream request failed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RealtimeSession' }
        '503':
          description: Provider or Firebase authentication is not configured (ask_unavailable, realtime_unavailable or auth_unavailable, as applicable).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { code: realtime_unavailable, message: "realtime is not configured on this server" }

  /v1/me/usage:
    get:
      security: [{ FirebaseIDToken: [] }]
      tags: [account]
      operationId: getUsage
      summary: Current server-owned plan and remaining daily generations.
      responses:
        '200':
          description: UTC reset time and generation ceilings; budgets may restrict access sooner. Never cached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageStatus' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: Usage storage unavailable; expensive operations remain blocked.
  /v1/realtime/connect:
    get:
      security: [{ VerbumVoiceTicket: [] }]
      tags: [realtime]
      operationId: connectVoice
      summary: WebSocket relay with server-enforced duration and spending limits.
      description: Requires a WebSocket client and the one-use ticket from POST /v1/realtime/session. Swagger UI cannot perform the WebSocket upgrade with Try it out.
      responses:
        '101':
          description: JSON Realtime events; verbum.limit carries code and optional retryAt before close.
        '401': { description: "Missing, expired or already consumed one-use ticket." }
        '429': { description: "Concurrent conversation, quota or budget limit." }
        '503': { description: "Usage storage or provider unavailable." }

components:
  securitySchemes:
    VerbumVoiceTicket:
      type: http
      scheme: bearer
      description: One-use ticket returned by createRealtimeSession, never a provider key.
    FirebaseIDToken:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: Firebase SDK ID token for a registered or anonymous user, validated against the configured project including revocation.
  parameters:
    EntityId:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: fixture.person.david
    Lang:
      name: lang
      in: query
      required: false
      schema: { type: string, enum: [en, pt, pt-BR], default: en }
      description: Presentation language; pt aliases pt-BR. Takes precedence over Accept-Language. Portuguese editorial requests do not silently fall back to English. Original scripts and identifiers remain unchanged. Missing language or unsupported values use en.

    AcceptLanguage:
      name: Accept-Language
      in: header
      schema: { type: string, example: pt-BR }
      description: Used when lang is absent; supported presentation languages are pt-BR and en.
    AppCheck:
      name: X-Firebase-AppCheck
      in: header
      schema: { type: string }
      description: Firebase App Check token. Required for protected generation when enforcement is enabled. Never a provider key.
    Installation:
      name: X-Verbum-Installation
      in: header
      schema: { type: string, minLength: 16, maxLength: 80 }
      description: Installation identifier used as an additional abuse signal; never substitutes for authentication.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string }
      description: Reuse for a retry of the same request. Reusing a key with different content returns 409. Shared content caching also avoids duplicate provider work.

  responses:
    Unauthenticated:
      description: Missing, invalid, expired, revoked or disabled Firebase identity. No paid operation is started.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Per-user, IP, process or concurrency limit reached. No paid operation is started.
      headers:
        Retry-After:
          schema: { type: integer, example: 60 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Unknown id, or no content for it yet.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { code: unknown_entity, message: "no entity with id 'nope'" }

  schemas:
    PersonalValue:
      type: object
      additionalProperties: false
      properties:
        book: {type: string, example: Job}
        chapter: {type: integer, minimum: 1, example: 38}
        verse: {type: integer, minimum: 1, maximum: 176, example: 4}
        highlight: {type: string, enum: [gold, sage, rose]}
        style: {type: string, enum: [background, underline, margin]}
        note: {type: string, description: Maximum 32768 UTF-8 bytes}
        bookmarked: {type: boolean}
        time: {type: integer, format: int64, description: Unix milliseconds for visit and position}
        day: {type: string, format: date}
    PersonalRecord:
      type: object
      required: [id, revision, value]
      properties:
        id: {type: string, example: 'annotation:Job.38.4'}
        revision: {type: integer, format: int64}
        value:
          oneOf:
            - $ref: '#/components/schemas/PersonalValue'
            - {type: 'null'}
    PersonalChange:
      type: object
      required: [id, mutationId]
      properties:
        id: {type: string, description: 'annotation:Book.chapter.verse, visit:Book.chapter, day:YYYY-MM-DD, position:last'}
        mutationId: {type: string, minLength: 16, maxLength: 80, description: Durable unique ID for this local edit}
        baseRevision: {type: integer, format: int64, default: 0}
        base:
          oneOf:
            - $ref: '#/components/schemas/PersonalValue'
            - {type: 'null'}
        value:
          oneOf:
            - $ref: '#/components/schemas/PersonalValue'
            - {type: 'null'}
    PersonalSyncRequest:
      type: object
      required: [cursor, changes]
      properties:
        cursor: {type: integer, format: int64, minimum: 0}
        changes:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/PersonalChange'}
    PersonalSyncResponse:
      type: object
      required: [cursor, more, records, accepted]
      properties:
        cursor: {type: integer, format: int64}
        more: {type: boolean}
        records:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/PersonalRecord'}
        accepted:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/PersonalRecord'}

    UsageRestriction:
      type: object
      required: [code]
      properties:
        code: { type: string }
        retryAt: { type: string, format: date-time }
    UsageStatus:
      type: object
      required: [plan, resetsAt, remaining, voiceSeconds, restricted]
      properties:
        plan: { type: string, enum: [guest, free, premium] }
        resetsAt: { type: string, format: date-time }
        remaining:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Remaining daily ask, embedding and voice generations. Standard narration is free and has no personal quota.
        standardNarration: { type: string, const: free, description: Available standard audio is reusable without a personal quota; missing chapters require global generation budget. }
        voiceSeconds: { type: integer }
        restricted: { type: boolean }

    SpeechRequest:
      type: object
      additionalProperties: false
      required: [text, language, bookId, chapter, translation]
      properties:
        bookId: { type: string, description: Canonical OSIS book identifier, example: John }
        chapter: { type: integer, minimum: 1, maximum: 150 }
        translation: { type: string, enum: [por_blj, BSB], description: Must match language and the canonical text. }
        verses:
          type: array
          minItems: 1
          maxItems: 176
          description: Optional ordered verses for synchronized narration. Their text joined by newlines must equal text exactly. Measured excerpts contain at most three verses (long verses can span several excerpts). Omitting verses returns audio without timing metadata; canonical chapter identifiers remain required.
          items:
            type: object
            additionalProperties: false
            required: [number, text]
            properties:
              number: { type: integer, minimum: 1, maximum: 176 }
              text: { type: string, minLength: 1 }
        revision:
          type: string
          description: Optional version from GET /v1/tts/config. A changed version returns 400 before generation; omitted preserves legacy behavior.
        text:
          type: string
          minLength: 1
          description: Exact chapter plain text, nonblank, at most 100000 UTF-8 bytes. Automatically segmented without truncation.
        language: { type: string, enum: [pt-BR, en-US] }
        voice:
          type: string
          maxLength: 128
          description: Omit to use the current server narrator. Portuguese defaults to Gemini 2.5 Pro TTS / Charon; English uses en-US-Standard-A. Only server-approved voices are accepted. Read /v1/tts/config for the current version.
          example: Charon
        speed: { type: number, enum: [1], default: 1, description: Adjust playback speed locally without regenerating speech. }
        pitch: { type: number, enum: [0], default: 0 }
        format: { type: string, enum: [MP3], default: MP3 }
    # ---- Errors (§52). Apps switch on `code`; `message` is for logs.
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [unauthenticated, app_attestation_required, auth_unavailable, rate_limited, unknown_entity, unknown_book, content_unavailable, malformed_request, internal, realtime_unavailable, ask_unavailable, tts_unavailable, tts_rate_limited, tts_timeout, tts_failed, quota_exceeded, budget_exhausted, plan_required, usage_unavailable, request_in_progress, idempotency_conflict]
        message: { type: string }
        retryAt: { type: string, format: date-time }
        fallback: { type: string, enum: [scripture_search] }

    # ---- §22.1
    BibleEntityType:
      type: string
      enum: [person, place, event, theme, passage, book, prophecy, originalTerm, historicalPeriod]

    BibleEntity:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/BibleEntityType' }
        name: { type: string }
        summary: { type: [string, 'null'], description: Short and non-interpretive (§3.5). }
        nameLanguage:
          type: string
          enum: [en, pt-BR]
          description: Selected presentation record, including fallback. OriginalTerm names keep the original script; its language is lexical.language. Absent for legacy entities without localization records.

    # ---- §22.2
    RelationshipType:
      type: string
      enum: [appearsIn, participatesIn, occursAt, occursDuring, references, relatedToTheme, relatedTo, precedes, follows, fulfills, quotes]

    BibleRelationship:
      type: object
      required: [id, sourceId, targetId, type, sourceReferenceIds]
      properties:
        id: { type: string }
        sourceId: { type: string }
        targetId: { type: string }
        type: { $ref: '#/components/schemas/RelationshipType' }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 1, description: Editorial confidence (§58); null = unrated. }
        sourceReferenceIds:
          type: array
          minItems: 1
          items: { type: string }

    # ---- A place in Scripture, translation-independent. OSIS book ids (Gen … Rev).
    PassageReference:
      type: object
      required: [bookId, chapter]
      properties:
        bookId: { type: string, example: 1Sam }
        chapter: { type: integer, minimum: 1 }
        verseStart: { type: integer, minimum: 1, description: Omitted with verseEnd for a whole chapter. }
        verseEnd: { type: integer, minimum: 1 }

    # ---- §33
    SourceReference:
      type: object
      required: [id, citation]
      properties:
        id: { type: string }
        citation: { type: string }
        url: { type: [string, 'null'], format: uri }

    # ---- §9
    OriginalTermPresentation:
      type: object
      required: [language, transliteration, strong]
      properties:
        language: { type: string, enum: [he, arc, grc] }
        transliteration: { type: string }
        strong: { type: string }

    EntityDetail:
      type: object
      required: [entity, aliases, keyPassages, sources]
      properties:
        originalTerm: { $ref: "#/components/schemas/OriginalTermPresentation", description: Canonical study metadata; localized meaning is entity.summary. }
        sourceRecords: { type: array, items: { $ref: '#/components/schemas/EntitySourceRecord' }, description: Optional attributed structured enrichment. }
        localizations: { type: array, items: { $ref: '#/components/schemas/EntityLocalization' }, description: Independent presentation records; absent when unavailable. }
        entity: { $ref: '#/components/schemas/BibleEntity' }
        aliases: { type: array, items: { type: string } }
        approximateDates: { type: [string, 'null'], description: 'Always hedged: "c. 1010–970 BC (commonly dated)".' }
        role: { type: [string, 'null'] }
        modernGeography: { type: [string, 'null'], description: Places only. }
        keyPassages: { type: array, items: { $ref: '#/components/schemas/PassageReference' } }
        sources: { type: array, items: { $ref: '#/components/schemas/SourceReference' } }

    EntityLocalization:
      type: object
      required: [language, sourceId, name, aliases]
      properties:
        language: { type: string, enum: [en, pt-BR] }
        sourceId: { type: string }
        name: { type: string }
        aliases: { type: array, items: { type: string } }
        description: { type: [string, 'null'] }

    LexicalData:
      type: object
      required: [language, original, transliteration, morphology, gloss, glossLanguage, extendedStrong, disambiguatedStrong, unifiedStrong]
      properties:
        language: { type: string, enum: [he, arc, grc] }
        original: { type: string }
        transliteration: { type: string }
        morphology: { type: string, description: Original STEP morphology code; may be empty. }
        gloss: { type: string, description: "Brief lexical metadata, not a verse translation." }
        glossLanguage: { type: string, enum: [en] }
        extendedStrong: { type: string }
        disambiguatedStrong: { type: string, description: Original field including relation annotations. }
        unifiedStrong: { type: string, description: Original field; may contain multiple identifiers. }

    DatasetProvenance:
      type: object
      required: [repository, revision, path, sha256, licenseUrl, attribution, modifications]
      properties:
        repository: { type: string, format: uri }
        revision: { type: string, pattern: '^[0-9a-f]{40}$' }
        path: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        licenseUrl: { type: string, format: uri }
        attribution: { type: string }
        modifications: { type: string }

    EntitySourceRecord:
      type: object
      required: [id, sourceId, externalId, sourceLine, identifiers, dataset, occurrenceCount]
      properties:
        id: { type: string }
        sourceId: { type: string }
        externalId: { type: string }
        sourceLine: { type: integer, minimum: 1 }
        identifiers:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        lexical: { $ref: '#/components/schemas/LexicalData' }
        dataset: { $ref: '#/components/schemas/DatasetProvenance' }
        occurrenceCount: { type: integer, minimum: 0 }

    # ---- §44
    GraphSnapshot:
      type: object
      required: [root, nodes, edges]
      properties:
        root: { $ref: '#/components/schemas/BibleEntity' }
        nodes: { type: array, items: { $ref: '#/components/schemas/BibleEntity' } }
        edges: { type: array, items: { $ref: '#/components/schemas/BibleRelationship' } }

    # ---- §10 / §22.4
    PassageContext:
      type: object
      required: [reference, entities, relatedPassages, sources]
      properties:
        reference: { $ref: '#/components/schemas/PassageReference', description: Always a whole chapter. }
        entities: { type: array, items: { $ref: '#/components/schemas/BibleEntity' } }
        relatedPassages:
          type: array
          items: { $ref: '#/components/schemas/PassageReference' }
          description: Share a connected entity with the chapter; not asserted to be quotations or parallels.
        sources: { type: array, items: { $ref: '#/components/schemas/SourceReference' } }

    # ---- §22.5 (+ sourceReferenceIds)
    TimelineDatePrecision:
      type: string
      enum: [exact, approximate, debated, unknown]

    TimelineEvent:
      type: object
      required: [id, title, datePrecision, entityIds, sourceReferenceIds]
      properties:
        id: { type: string }
        title: { type: string }
        startYear: { type: [integer, 'null'], description: Negative = BC (-1010 is 1010 BC). }
        endYear: { type: [integer, 'null'], description: Null with a startYear = a point in time. }
        datePrecision: { $ref: '#/components/schemas/TimelineDatePrecision' }
        summary: { type: [string, 'null'] }
        entityIds: { type: array, items: { type: string } }
        sourceReferenceIds: { type: array, items: { type: string } }

    # ---- §27
    SearchResponse:
      type: object
      required: [query, passages, books, entities]
      properties:
        query: { type: string }
        passages: { type: array, items: { $ref: '#/components/schemas/PassageReference' } }
        books:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string, description: OSIS id; the apps carry the canon and its names. }
        entities: { type: array, items: { $ref: '#/components/schemas/BibleEntity' } }

    # ---- Realtime voice sessions (not in §45; owner-requested infrastructure ahead of a
    # client feature, so an app can build on it later without a backend change)
    RealtimeSession:
      type: object
      required: [clientSecret, expiresAt, model]
      properties:
        clientSecret:
          type: string
          description: >-
            Opaque one-use Verbum ticket. Send only to relayPath on the API host. Never log or persist it.
        expiresAt:
          type: integer
          description: Unix seconds after which this secret can no longer start a session.
        model: { type: string }
        relayPath: { type: string, const: /v1/realtime/connect }
        maxDurationSeconds: { type: integer, minimum: 1 }

    # ---- §30 AI Response Data Contract, verbatim
    AskResponse:
      type: object
      required: [answer, summary, passageReferences, entityReferences, sourceReferences, confidence, interpretiveVariance]
      properties:
        fallback:
          $ref: '#/components/schemas/UsageRestriction'
        answer: { type: string, description: "Empty when no reliable, citable answer was found." }
        summary: { type: string }
        passageReferences:
          type: array
          items: { $ref: '#/components/schemas/PassageReference' }
          description: Verified citations when answer is nonempty. When answer is empty, these are nearby indexed search results and do not substantiate the requested claim.
        entityReferences:
          type: array
          items: { type: string }
          description: Editorial entities linked to the verified cited passages; empty when no links exist.
        sourceReferences:
          type: array
          items: { $ref: '#/components/schemas/SourceReference' }
        confidence:
          type: string
          enum: [low, medium, high]
        interpretiveVariance:
          type: boolean
          description: True when Christian traditions/scholars meaningfully disagree on this question (§31).
